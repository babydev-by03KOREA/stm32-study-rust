[package]
name = "rust-tutorial"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-stm32 = { version = "0.6.0", features = ["stm32f103c8", "defmt"] }
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = 2          # 칩에 올라가는 크기는 안 늘고, 디버깅 정보만 남김
opt-level = "s"    # 크기 우선 최적화

[[bin]]
name = "rust-tutorial"
test = false
bench = false
